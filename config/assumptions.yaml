project: a_who_pays
data_mode: raw             # "raw" = real files in data/raw, "synthetic" = fake demo data

paths:                     # change to the real file names once downloaded
  ghs: data/raw/statssa/ghs-2025-household-v1.dta
  ies: data/raw/statssa/ies_households.csv
  nfcm: data/raw/statssa/nfcm_provincial.csv

units:
  ies_income_divisor: 12   # the IES reports ANNUAL amounts, so divide by 12

thresholds:                # electricity bill as a share of household income
  bill_to_income: [0.08, 0.10, 0.12]
  headline: 0.10
  grid_min: 0.05
  grid_max: 0.20
  grid_step: 0.01

indigent:                  # municipal cut-offs differ, so test several (rand per month)
  income_cutoffs_rand: [3000, 4500, 6000]
  headline_cutoff_rand: 4500

scenarios:
  able_to_pay_share: [0.30, 0.50, 0.70]
  headline_share: 0.50
  nonpayer_pool_share: [0.3, 0.5, 0.7, 1.0]   # non-payers drawn from the poorest X% of payers
  collection_rate: [0.5, 0.7, 1.0]            # share of able-to-pay non-payers actually collected from

price_update:              # scale IES bills (2022/23) to 2025/26 prices using tariff increases
  factor_low: 1.271        # IES prices taken as FY2023/24 level
  factor_central: 1.34     # time-weighted across the IES fieldwork period
  factor_high: 1.508       # IES prices taken as FY2022/23 level

price_multiplier:          # real price relative to household income, vs the IES year
  multipliers: [1.0, 1.25, 1.5, 2.0, 2.5, 3.0, 4.0]
  elasticities: [0.0, -0.2, -0.5]    # 0 = consumption fixed
  current_real_multiplier: 1.28      # rough: tariff up about 34-46% since IES, CPI about 8-12%
  real_growth_rates: [0.03, 0.05, 0.07]

tariff:                    # VERIFY every number below against the NERSA MYPD6 decision
  allowable_revenue_rand_bn: 384.61
  sales_volume_gwh: 192710
  unpaid_share_of_volume: [0.03, 0.045, 0.078]  # 0.045 = R15.8bn not recognised in FY2026 results
  headline_unpaid_share: 0.045

column_map:                # left = our name, right = column name in the raw file
  ghs:
    weight: house_wgt            # confirmed in the GHS 2025 household file
    province: prov               # confirmed
    pays_electricity: eng_pay    # in the GHS 2025 catalogue; 1 yes, 2 no, 3 dk, 8 n/a
    supplier: eng_supply         # 1 municipality, 2 Eskom, 3 dk, 4 other, 8 n/a
  ies:
    weight: weight               # derived by prepare_inputs.py
    province: province           # first digit of the household id (to verify)
    income: income               # annual cash plus in-kind income
    electricity_spend: electricity_spend   # COICOP 4510100, annual
  nfcm:
    province: province
    indigent_registered: indigent_households   # NFCM 2023*, identified by municipalities
    fbe_households: fbe_households             # NFCM 2023*, free basic electricity
